name: Build pinned NiceEval ViewRevision preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Pinned static ViewRevision
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout NiceEval-Preview
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.18.0
          runtime: node@24
          install: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = "11.18.0"
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"

      - name: Install Preview dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact pinned static ViewRevision
        run: pnpm preview:build

      - name: Check published allowlist
        run: pnpm preview:verify

      - name: Upload static ViewRevision
        uses: actions/upload-artifact@v4
        with:
          name: niceeval-viewrevision-preview
          path: .preview-site
          if-no-files-found: error
